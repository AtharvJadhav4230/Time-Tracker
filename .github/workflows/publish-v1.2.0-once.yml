name: Publish v1.2.0 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.0-once.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Require successful CI for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $passed = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $runs = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow tests.yml --commit $env:GITHUB_SHA --event push --limit 5 --json status,conclusion | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw "Unable to read the required test run." }
            $latest = $runs | Select-Object -First 1
            if ($latest -and $latest.status -eq "completed") {
              if ($latest.conclusion -ne "success") { throw "Required CI did not pass." }
              $passed = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $passed) { throw "Timed out waiting for the exact-commit CI result." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release version
        shell: pwsh
        run: |
          $actual = python -c "import timetracker; print(timetracker.__version__)"
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne "1.2.0") { throw "Release version does not match 1.2.0." }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip setup failed." }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Test and build installer
        shell: pwsh
        run: .\build_release.ps1 -Version 1.2.0

      - name: Create release with verified installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.2.0"
          $installer = Get-Item .\release\LocalTimeTracker-Setup-1.2.0-x64.exe
          $checksum = Get-Item .\release\SHA256SUMS.txt
          $existingJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { throw "The release is already public; refusing to replace it." }
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) { throw "Existing draft targets a different commit." }
            gh release upload $tag $installer.FullName $checksum.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $installer.FullName $checksum.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file docs/releases/v1.2.0.md --title "Local Time Tracker v1.2.0" --draft
          }
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
