name: Complete verified v1.3.0 publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.3.0.yml"

permissions:
  contents: read

jobs:
  complete:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "7383e3dc7a0cec9a7868bffa02996b0c7ead0177"
      - name: Verify existing draft, source CI and every uploaded file
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $source = "7383e3dc7a0cec9a7868bffa02996b0c7ead0177"
          $releaseId = 402743611
          $tag = "v1.3.0"
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $ref.object.sha -ne $source) { throw "Unexpected release source." }
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$source&event=push&per_page=50" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Source CI cannot be verified." }
          foreach ($name in @("Tests", "Windows validation", "Record fictional Windows demo")) {
            $run = $response.workflow_runs | Where-Object { $_.name -eq $name -and $_.head_sha -eq $source } | Select-Object -First 1
            if (-not $run -or $run.status -ne "completed" -or $run.conclusion -ne "success") {
              throw "$name did not pass on the tagged source."
            }
          }
          # Draft releases are fetched by ID; the by-tag endpoint returns 404.
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.id -ne $releaseId -or $release.tag_name -ne $tag -or -not $release.draft) {
            throw "Unexpected draft release."
          }
          $digests = @{
            "LocalTimeTracker-1.3.0-portable-x64.zip" = "7de28ed97a9ea2911c1213a81e730019536ce2d93b1ddc81d7d0c7202c058059"
            "LocalTimeTracker-Setup-1.3.0-x64.exe" = "abda5aa4a7acc74e2809dc2aadfe7b0c9b1739944d772e94cb4ef56b34d522dc"
            "LocalTimeTracker-demo.mp4" = "3245b966fbf4292709879b85fe7e5b76694f3cd1700839a116cdb90294584921"
            "LocalTimeTracker-demo.txt" = "dc4269683880f6e07ccf815cb211973dba43989ec9a8fa354eeaab3119d32bc8"
            "SHA256SUMS.txt" = "72f873c5bd491ab4755e936db8f40b13688ee8f175265283d793009c9e65d95e"
          }
          if ($release.assets.Count -ne $digests.Count) { throw "Unexpected draft asset count." }
          $destination = Join-Path $env:RUNNER_TEMP "verified-v1.3.0-assets"
          New-Item -ItemType Directory -Path $destination | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/octet-stream"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          foreach ($name in $digests.Keys) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (-not $asset -or $asset.size -le 0 -or $asset.digest -ne ("sha256:" + $digests[$name])) {
              throw "Draft asset metadata changed: $name"
            }
            $path = Join-Path $destination $name
            Invoke-WebRequest -Uri $asset.url -Headers $headers -OutFile $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $digests[$name] -or (Get-Item -LiteralPath $path).Length -ne $asset.size) {
              throw "Downloaded asset does not match the verified upload: $name"
            }
            Write-Host "Verified uploaded bytes: $name"
          }
          $checksums = @(Get-Content -LiteralPath (Join-Path $destination "SHA256SUMS.txt"))
          foreach ($name in @("LocalTimeTracker-Setup-1.3.0-x64.exe", "LocalTimeTracker-1.3.0-portable-x64.zip")) {
            if ($checksums -notcontains ($digests[$name] + " *" + $name)) { throw "Published checksum mismatch: $name" }
          }
          if ($checksums.Count -ne 2) { throw "Unexpected checksum file." }
          "VERIFIED_RELEASE_ID=$releaseId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish the verified existing draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $notes = Get-Content -LiteralPath "docs/releases/v1.3.0.md" -Raw
          $notes = $notes.Replace("(../WINDOWS_VALIDATION.md)", "(https://github.com/HafidIdrissi/Time-Tracker/blob/v1.3.0/docs/WINDOWS_VALIDATION.md)")
          $notes = $notes.Replace("(../../CONTRIBUTING.md)", "(https://github.com/HafidIdrissi/Time-Tracker/blob/v1.3.0/CONTRIBUTING.md)")
          $notesPath = Join-Path $env:RUNNER_TEMP "v1.3.0-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:VERIFIED_RELEASE_ID" -F draft=false -f make_latest=true -F "body=@$notesPath" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Publication failed." }
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v1.3.0" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or $published.id -ne 402743611) {
            throw "Published release verification failed."
          }
          Write-Host "Published verified release: $($published.html_url)"
